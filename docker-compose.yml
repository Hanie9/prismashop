networks:
  db_net:
  web_net:
    external: true

services:
  postgres:
    image: postgres:17-alpine
    container_name: prismashop_postgres
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prisma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-prismashop}
    volumes:
      - ${PRISMASHOP_DATA_DIR:-/home/amir/prismashop_data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prisma} -d ${POSTGRES_DB:-prismashop}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - db_net

  backend:
    build:
      context: ./backend
    container_name: prismashop_backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prisma}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prismashop}
      SECRET_KEY: ${SECRET_KEY}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://prismashop.ir,https://www.prismashop.ir}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://prismashop.ir}
      UPLOAD_DIR: /app/uploads
      ADMIN_MOBILE: ${ADMIN_MOBILE:-09355191020}
      SMS_IR_API_KEY: ${SMS_IR_API_KEY:-}
      SMS_IR_TEMPLATE_ID: ${SMS_IR_TEMPLATE_ID:-0}
      SMS_IR_TEMPLATE_PARAM: ${SMS_IR_TEMPLATE_PARAM:-Code}
    volumes:
      - ${PRISMASHOP_DATA_DIR:-/home/amir/prismashop_data}/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - db_net
      - web_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://prismashop.ir}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: prismashop_frontend
    restart: on-failure
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - web_net
